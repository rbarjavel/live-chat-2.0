[package]
name = "image-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"
serde_json = "1.0"
opener = "0.7"

# GUI dependencies
eframe = "0.29"
egui = "0.29"
rfd = "0.14"

[lints.clippy]
pedantic      = { level = "deny", priority = -1 }
nursery       = { level = "deny", priority = -1 }
unwrap_used   = "deny"